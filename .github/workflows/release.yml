name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  compatibility-tests:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  build-nuitka:
    name: Build Nuitka ${{ matrix.platform }} executables
    runs-on: ${{ matrix.os }}
    needs: compatibility-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            artifact-glob: "dist/snapz*-linux-x86_64"
          - os: windows-latest
            platform: windows-x86_64
            artifact-glob: "dist/snapz*-windows-x86_64.exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Build Nuitka executables
        shell: bash
        run: ./scripts/build.sh nuitka

      - name: Smoke test Nuitka executables
        shell: bash
        run: ./scripts/build.sh smoke-nuitka

      - name: Upload Nuitka release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: snapz-${{ github.ref_name }}-${{ matrix.platform }}-nuitka
          path: ${{ matrix.artifact-glob }}

  build-and-release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    needs: [compatibility-tests, build-nuitka]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          project_version="$(
            python -c 'import re; print(re.search(r"^version = \"([^\"]+)\"", open("pyproject.toml", encoding="utf-8").read(), re.M).group(1))'
          )"
          if [ "$version" != "$project_version" ]; then
            echo "tag $tag does not match pyproject.toml version $project_version" >&2
            exit 1
          fi

      - name: Run tests
        run: python -m pytest

      - name: Build release artifacts
        run: ./scripts/build.sh all

      - name: Stage English release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-dist
          cp dist/* release-dist/

      - name: Build Chinese release artifacts
        run: ./scripts/build.sh --lang zh all

      - name: Stage Chinese release artifacts
        run: |
          set -euo pipefail
          version="$(
            python -c 'import re; print(re.search(r"^version = \"([^\"]+)\"", open("pyproject.toml", encoding="utf-8").read(), re.M).group(1))'
          )"
          cp dist/snapz.pyz release-dist/snapz-zh.pyz
          cp dist/snapz-server.pyz release-dist/snapz-server-zh.pyz
          cp "dist/snapz-cli_${version}_all.deb" "release-dist/snapz-cli_${version}_all.zh.deb"

      - name: Download Nuitka release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: snapz-${{ github.ref_name }}-*-nuitka
          path: nuitka-dist
          merge-multiple: true

      - name: Stage Nuitka release artifacts
        run: |
          set -euo pipefail
          cp nuitka-dist/* release-dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: snapz-${{ github.ref_name }}-dist
          path: release-dist/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-dist/* --clobber
          else
            gh release create "$tag" release-dist/* \
              --verify-tag \
              --title "snapz $tag" \
              --notes "Automated release for snapz $tag."
          fi
