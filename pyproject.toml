[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snapz-cli"
version = "2.0.0"
description = "Lightweight directory snapshot CLI: snapz <path> -> tar.zst archive in ~/.snapz-all/"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "snapz contributors" }]
keywords = ["snapshot", "backup", "tar", "zstd", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
dependencies = [
    "pathspec>=0.12",
]

[project.optional-dependencies]
zstd = ["zstandard>=0.22"]
completion = ["argcomplete>=3.1"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "zstandard>=0.22",
    "argcomplete>=3.1",
]

[project.scripts]
snapz = "snapz.cli:main"
snapz-server = "snapz_server.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["snapz*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
